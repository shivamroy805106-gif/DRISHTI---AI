services:
  - type: web
    name: drishti-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python ml/train.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /tmp/uploads

  - type: web
    name: drishti-ai-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: ~18.0.0
      - key: VITE_API_URL
        value: "https://drishti-ai-backend.onrender.com" # Change this if your backend name changes
